<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculo de Pago de COmbustible</title>
    <h1>Calculo de Pago de Combustible</h1>
    <p>Regular: Q29.50       Super: Q32.50       Diesel: Q38.00</p>
    <h3> Extencion temporal del IVA y del IDP - impuesto al valor Agregado (IVA) y del impuesto a la distribucion de petreoleo crudo y combustible 
        derivados del petreoleo (IDP) segun Acuerdo gubernativo 164-2026</h3>
    <link rel="stylesheet" href="Styles.css">

    
</head>
<body>
    <script src="script.js" defer></script>
    <h2>Datos del Calculo</h2>
    <form id="fuelCalcForm">
        <label for="fuelType">Tipo de Combustible: </label>
        <select id="fuelType" name="fuelType">
            <option value="regular" = Q29.50 >Regular</option>
            <option value="super" = Q32.50 >Super</option>
            <option value="diesel" = Q38.00 >Diesel</option>
        </select>
        <br><br>
        <label for="amount">Cantidad (galones):</label>
        <input type="number" id="amount" name="amount" step="0.01" required>
        <br><br>
        <label for="unitPrice">Precio por galon (Q):</label>
        <select id= "unitPrice" name="unitPrice">
            <option value="29.50">Regular</option>
            <option value="32.50">Super</option>
            <option value="38.00">Diesel</option>
        </select>
        <br><br>
        <label % de excencion aplicado for="exemption">Porcentaje de Exención (%):</label>
        <input type="number" id="exemption" name="exemption" step="0.01" required>
        <br><br>

        <button type="submit">Calcular</button>
        <p id="resultados"></p>
        
    </form>

</body>
</html>
